apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: epay
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.1
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper/data
            - name: logs
              mountPath: /var/lib/zookeeper/log
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo ok"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo ok"
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zookeeper-data
        - name: logs
          persistentVolumeClaim:
            claimName: zookeeper-logs

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: epay
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
  clusterIP: None
