apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: epay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: epay-nginx:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
            - containerPort: 8080
              name: metrics
          volumeMounts:
            - name: main-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: upstreams-conf
              mountPath: /etc/nginx/conf.d/04-upstreams.conf
              subPath: 04-upstreams.conf
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: main-conf
          configMap:
            name: nginx-main-conf
        - name: upstreams-conf
          configMap:
            name: nginx-upstreams-conf

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: epay
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: metrics
      port: 8080
      targetPort: 8080
      nodePort: 30880
