apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: epay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - -config.file=/etc/promtail/promtail-config.yml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/promtail-config.yml
              subPath: promtail-config.yml
            - name: logs
              mountPath: /var/log/epay
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: logs
          persistentVolumeClaim:
            claimName: epay-logs
