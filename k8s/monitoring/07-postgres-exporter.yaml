apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: epay
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres-exporter }
  template:
    metadata:
      labels: { app: postgres-exporter }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_URI
              value: "postgres:5432/epay?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: epay-db-secret
                  key: db-username
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: epay-db-secret
                  key: db-password
          ports:
            - containerPort: 9187
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: epay
spec:
  selector: { app: postgres-exporter }
  ports:
    - port: 9187
      targetPort: 9187