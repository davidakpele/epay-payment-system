apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: epay
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-exporter }
  template:
    metadata:
      labels: { app: redis-exporter }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          args: ["--redis.addr=redis://redis:6379"]
          ports:
            - containerPort: 9121
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: epay
spec:
  selector: { app: redis-exporter }
  ports:
    - port: 9121
      targetPort: 9121
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: epay
spec:
  replicas: 1
  selector:
    matchLabels: { app: nginx-exporter }
  template:
    metadata:
      labels: { app: nginx-exporter }
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.1.0
          args: ["--nginx.scrape-uri=http://nginx:8080/nginx_status"]
          ports:
            - containerPort: 9113
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter
  namespace: epay
spec:
  selector: { app: nginx-exporter }
  ports:
    - port: 9113
      targetPort: 9113