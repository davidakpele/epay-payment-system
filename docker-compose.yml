services:
  # ============================================
  #  CORE INFRASTRUCTURE SERVICES
  # ============================================

  postgres:
    image: postgres:16-alpine
    container_name: epay-postgres
    environment:
      POSTGRES_DB: epay
      POSTGRES_USER: ${DB_USERNAME:-epay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-epay} -d epay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: epay-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-epay}:${DB_PASSWORD:-epay}@postgres:5432/epay?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - epay-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: epay-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - epay-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: epay-nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:8080/nginx_status"
    ports:
      - "9113:9113"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - epay-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    container_name: epay-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: epay-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "echo ruok | timeout 2 bash -c 'cat > /dev/tcp/localhost/2181' && echo ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: epay-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    # Port 9092 is NOT exposed to the host — all internal clients use kafka:29092.
    # Exposing it caused HTTP probes from the host to hit Kafka's binary port,
    # producing InvalidReceiveException spam. Remove the mapping to stop that.
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: epay-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: epay-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - epay-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  epay-server-base: &server-base
    build:
      context: ./epay
      dockerfile: Dockerfile
    image: epay-server:latest
    environment: &server-base-env
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME:-epay}
      DB_PASSWORD: ${DB_PASSWORD:-epay}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/epay
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_LISTENER_CONCURRENCY: 3
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXNlY3VyZS1kZXYtb25seS1zZWNyZXQta2V5LTMyLWJ5dGVzLWxvbmchISE=}
      SERVER_PORT: 8029
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-superadmin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-superadmin@epay.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-ChangeMe@2026!}
      SUPER_ADMIN_FIRST_NAME: ${SUPER_ADMIN_FIRST_NAME:-Super}
      SUPER_ADMIN_LAST_NAME: ${SUPER_ADMIN_LAST_NAME:-Admin}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-}
      BANKING_SERVICE_EMAIL: ${BANKING_SERVICE_EMAIL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      INSTANCE_ID: ${HOSTNAME:-unknown}
      SPRING_DATASOURCE_HIKARI_MAXIMUM-POOL-SIZE: 10
      SPRING_DATASOURCE_HIKARI_MINIMUM-IDLE: 5
      SPRING_DATASOURCE_HIKARI_IDLE-TIMEOUT: 300000
      SPRING_DATASOURCE_HIKARI_CONNECTION-TIMEOUT: 30000
      SPRING_DATASOURCE_HIKARI_MAX-LIFETIME: 1800000
      SPRING_REDIS_LETTUCE_POOL_MAX-ACTIVE: 20
      SPRING_REDIS_LETTUCE_POOL_MAX-IDLE: 10
      SPRING_REDIS_LETTUCE_POOL_MIN-IDLE: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8029/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - app_uploads:/var/www/uploads
      - epay_logs:/var/log/epay
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  epay-server-1:
    <<: *server-base
    container_name: epay-server-1
    ports:
      - "8021:8029"
    environment:
      <<: *server-base-env
      INSTANCE_ID: epay-server-1

  # epay-server-2:
  #   <<: *server-base
  #   container_name: epay-server-2
  #   ports:
  #     - "8022:8029"
  #   environment:
  #     <<: *server-base-env
  #     INSTANCE_ID: epay-server-2

  # epay-server-3:
  #   <<: *server-base
  #   container_name: epay-server-3
  #   ports:
  #     - "8023:8029"
  #   environment:
  #     <<: *server-base-env
  #     INSTANCE_ID: epay-server-3

  # Backend Instance 4 (Optional - for high load)
  # epay-server-4:
  #   <<: *server-base
  #   container_name: epay-server-4
  #   ports:
  #     - "8024:8029"

  frontend-base: &frontend-base
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: epay-frontend:latest
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://epay-server:8029}
      INSTANCE_ID: ${HOSTNAME:-unknown}
    depends_on:
      epay-server-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend-1:
    <<: *frontend-base
    container_name: epay-frontend-1
    ports:
      - "3001:3000"

  # frontend-2:
  #   <<: *frontend-base
  #   container_name: epay-frontend-2
  #   ports:
  #     - "3002:3000"

  # frontend-3:
  #   <<: *frontend-base
  #   container_name: epay-frontend-3
  #   ports:
  #     - "3003:3000"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: epay-nginx:latest
    container_name: epay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - nginx_logs:/var/log/nginx:rw
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      epay-server-1:
        condition: service_healthy
      frontend-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/nginx-health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  loki:
    build:
      context: ./epay/monitoring/loki
      dockerfile: Dockerfile
    image: epay-loki:latest
    container_name: epay-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  promtail:
    build:
      context: ./epay/monitoring/promtail
      dockerfile: Dockerfile
    image: epay-promtail:latest
    container_name: epay-promtail
    volumes:
      - epay_logs:/var/log/epay:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    build:
      context: ./epay/monitoring/prometheus
      dockerfile: Dockerfile
    image: epay-prometheus:latest
    container_name: epay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./epay/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./epay/monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    depends_on:
      - epay-server-1
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    build:
      context: ./epay/monitoring/grafana
      dockerfile: Dockerfile
    image: epay-grafana:latest
    container_name: epay-grafana
    ports:
      - "3010:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./epay/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./epay/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ============================================
  #  ALERTMANAGER — routes Prometheus alerts to
  #  email / Slack / PagerDuty / etc.
  #  UI: http://localhost:9093
  # ============================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: epay-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./epay/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
      - "--cluster.listen-address=" # single-instance mode (no HA clustering)
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-alerts@epay.app}
      ALERT_EMAIL_TEAM: ${ALERT_EMAIL_TEAM:-team@epay.app}
      ALERT_EMAIL_CRITICAL: ${ALERT_EMAIL_CRITICAL:-willstonestrategic@gmail.com}
      ALERT_EMAIL_PAYMENTS: ${ALERT_EMAIL_PAYMENTS:-payments-team@epay.app}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  #  cADVISOR — per-container CPU / memory /
  #  network / disk metrics scraped by Prometheus
  #  UI: http://localhost:8081
  # ============================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: epay-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - epay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  app_uploads:
    driver: local
  epay_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  nginx_logs:
    driver: local
  alertmanager_data:
    driver: local

networks:
  epay-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.28.0.0/16
