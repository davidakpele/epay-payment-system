# ── Test / CI profile ────────────────────────────────────────────────────────
# Activated by --spring.profiles.active=test (used in k6 smoke test CI job).
# Overrides production defaults that require infrastructure not available on
# a bare GitHub Actions runner.

logging:
  # Write log files to the system temp dir instead of /var/log/epay so the
  # app starts successfully on any runner without needing sudo mkdir.
  file:
    path: ${java.io.tmpdir}/epay-logs

management:
  tracing:
    # Disable Zipkin export in test/CI — zipkin:9411 is not available on the runner.
    export:
      zipkin:
        enabled: false
  health:
    mail:
      # Disable mail health check — SMTP is not available in CI.
      enabled: false
