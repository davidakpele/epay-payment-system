logging:
  file:
    path: ${java.io.tmpdir}/epay-logs

management:
  tracing:
    export:
      zipkin:
        enabled: false
  health:
    mail:
      enabled: false
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:}

flutterwave:
  public-key: ${FLUTTERWAVE_PUBLIC_KEY:}
  secret-key: ${FLUTTERWAVE_SECRET_KEY:}

spring:
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  health:
    mail:
      enabled: false
