spring:
  application:
    name: epay-server
  instance:
    id: ${INSTANCE_ID:unknown}
  mvc:
    contentnegotiation:
      favor-parameter: false
      favor-path-extension: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  main:
    allow-bean-definition-overriding: true

  error:
    include-message: never
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/epay}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariPool
      auto-commit: false
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 5000
          batch_versioned_data: true
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true

  sql:
    init:
      mode: never

  data:
    rest:
      base-path: /data-rest
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  cloud:
    task:
      initialize-enabled: false
      table-prefix: TASK_

  devtools:
    restart:
      enabled: false
      exclude: "static/**,public/**"
    livereload:
      enabled: false

  web:
    resources:
      add-mappings: false
      static-locations:
        - classpath:/static/
        - file:${FILE_UPLOAD_DIR:/var/www/uploads/images}/

  security:
    filter:
      dispatcher-types: REQUEST,ERROR,ASYNC

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 0
      location: /tmp

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${SERVER_PORT:8029}

pesco:
  banking:
    service:
      email: ${BANKING_SERVICE_EMAIL}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/www/uploads/images}
  max-file-size: 50MB
  allowed-file-types: image/jpeg,image/png,image/gif,image/webp

epay:
  logging:
    enabled: true
    excluded-paths:
      - /actuator/**
      - /favicon.ico
      - /static/**
      - /uploads/**

  security:
    jwt:
      secret: ${JWT_SECRET}        
      issuer: ${JWT_ISSUER:https://auth.epay.com}
      audience: "Unified Dynamic Systems"
      algorithm: HS256
      token-prefix: Bearer
      authorization-header: Authorization
      clock-skew-seconds: 30
      expiration-ms: 3600000
      expiration-minutes: 30
      refresh-expiration-days: 7
      access-token:
        expiration: 900000
      refresh-token:
        expiration: 604800000
      enable-token-rotation: true
      rotation-grace-period-minutes: 5
      enable-token-blacklist: true
      blacklist-cleanup-interval-minutes: 60
      max-blacklist-size: 10000
      max-tokens-per-user: 5
      enable-multi-factor-support: false
      log-token-issuance: false
      cookie-name: jwt-token
      http-only-cookie: true
      secure-cookie: ${JWT_SECURE_COOKIE:true}
      same-site-cookie: Strict
      cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8000}
    lockout:
      enabled: true
      max-attempts: 3
      base-duration-minutes: 20
      step-minutes: 15
      max-duration-minutes: 1440
      fail-window-minutes: 30
      level-ttl-hours: 24
      recent-ips: 5

  rate-limit:
    default-bucket:
      capacity: 100
      refill-tokens: 10
      refill-period-seconds: 1
    routes:
      auth:
        capacity: 20
        refill-tokens: 5
        refill-period-seconds: 1
      wallet:
        capacity: 30
        refill-tokens: 10
        refill-period-seconds: 1
      user:
        capacity: 50
        refill-tokens: 10
        refill-period-seconds: 1

  gateways:
    paystack:
      secret-key: ${PAYSTACK_SECRET_KEY}
      transfer-otp: ${PAYSTACK_TRANSFER_OTP:}
    flutterwave:
      secret-key: ${FLUTTERWAVE_SECRET_KEY}

  cards:
    sudo:
      api-key: ${SUDO_API_KEY:}

  super-admin:
    username: ${SUPER_ADMIN_USERNAME}
    email: ${SUPER_ADMIN_EMAIL}
    password: ${SUPER_ADMIN_PASSWORD}  
    first-name: ${SUPER_ADMIN_FIRST_NAME:Super}
    last-name: ${SUPER_ADMIN_LAST_NAME:Admin}
    phone: ${SUPER_ADMIN_PHONE:}

  risk:
    high-freq-count: 20
    freq-window-minutes: 60
    high-volume-threshold: 5000000
    volume-window-minutes: 60
    rapid-cycle-min-outbound: 3
    rapid-cycle-window-minutes: 30
    failed-tx-threshold: 10
    new-account-hours: 24
    min-account-age-minutes: 30
    soft-block-score: 60
    hard-block-score: 80

  liquidity:
    sync-interval-ms: 1800000

  maintenance:
    cron: "0 30 0 1 * *"
    batch-size: 500

  webhooks:
    retry-interval-ms: 60000

# Third-party gateway clients
paystack:
  api:
    url: https://api.paystack.co
    key: ${PAYSTACK_SECRET_KEY}

flutterwave:
  url: https://api.flutterwave.com/v3
  public-key: ${FLUTTERWAVE_PUBLIC_KEY}
  secret-key: ${FLUTTERWAVE_SECRET_KEY}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER}

geolocation:
  ip-api:
    base-url: http://ip-api.com
    timeout-seconds: 3
  cache:
    max-size: 5000
    expire-hours: 24

springdoc:
  packages-to-scan: com.epay
  show-actuator: false
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /docs
    enabled: ${SWAGGER_ENABLED:false}
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
    default-models-expand-depth: 1

datasource:
  micrometer:
    includes: all

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    mail:
      enabled: false
    data-redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1} 
    export:
      zipkin:
        endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}
        connect-timeout: 5s
        read-timeout: 10s

logging:
  include-application-name: false
  file:
    path: /var/log/epay
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation: WARN
    org.springframework.security: INFO
    org.springframework.security.web.FilterChainProxy: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    zipkin2.reporter: WARN
    io.micrometer.tracing: WARN