global:
  # How long to wait before re-sending an alert that has already fired
  resolve_timeout: 5m

  # SMTP settings — set real values via environment variables or Docker secrets
  smtp_smarthost:   '${SMTP_HOST:-smtp.gmail.com}:587'
  smtp_from:        '${ALERT_FROM_EMAIL:-alerts@epay.app}'
  smtp_auth_username: '${GMAIL_USERNAME}'
  smtp_auth_password: '${GMAIL_APP_PASSWORD}'
  smtp_require_tls: true

# ── Routing tree ───────────────────────────────────────────────────────────
route:
  # Default receiver for anything not matched below
  receiver: 'email-team'

  # Group alerts by service so one email covers multiple firing instances
  group_by: ['alertname', 'service', 'severity']
  group_wait:      30s   # wait before sending the first alert in a group
  group_interval:  5m    # wait before sending new alerts for an existing group
  repeat_interval: 4h    # re-send still-firing alerts every 4 h

  routes:
    # ── Critical alerts → immediate email + Slack (if configured) ──────────
    - match:
        severity: critical
      receiver: 'email-critical'
      group_wait:     10s
      repeat_interval: 1h
      continue: true   # also fall through to default receiver

    # ── Payment / business metric alerts → dedicated receiver ──────────────
    - match_re:
        service: 'payment|wallet|deposit|withdraw|escrow'
      receiver: 'email-payments'
      repeat_interval: 2h

    # ── Infrastructure warnings (non-critical) ─────────────────────────────
    - match:
        severity: warning
      receiver: 'email-team'
      repeat_interval: 6h

# ── Inhibition rules ──────────────────────────────────────────────────────
# Suppress lower-severity alerts when a critical one fires for the same service
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['service']

# ── Receivers ─────────────────────────────────────────────────────────────
receivers:
  - name: 'email-team'
    email_configs:
      - to: '${ALERT_EMAIL_TEAM:-team@epay.app}'
        send_resolved: true
        html: |
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b><br/>
          Service : {{ .Labels.service }}<br/>
          Severity: {{ .Labels.severity }}<br/>
          Summary : {{ .Annotations.summary }}<br/>
          Description: {{ .Annotations.description }}<br/>
          Action  : {{ .Annotations.action }}<br/>
          {{ if eq .Status "resolved" }}<span style="color:green">✅ RESOLVED</span>{{ else }}<span style="color:red">🔥 FIRING</span>{{ end }}
          <hr/>
          {{ end }}

  - name: 'email-critical'
    email_configs:
      - to: '${ALERT_EMAIL_CRITICAL:-oncall@epay.app}'
        send_resolved: true
        headers:
          Subject: '🚨 CRITICAL — {{ .GroupLabels.alertname }} ({{ .GroupLabels.service }})'

  - name: 'email-payments'
    email_configs:
      - to: '${ALERT_EMAIL_PAYMENTS:-payments-team@epay.app}'
        send_resolved: true
        headers:
          Subject: '💳 Payment Alert — {{ .GroupLabels.alertname }}'

