name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Run every Monday at 08:00 UTC to catch newly disclosed CVEs
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # Required to upload SARIF results to GitHub Security tab
  actions: read

jobs:
  # ── 1. OWASP Dependency-Check (Backend) ───────────────────────────────────
  owasp-dependency-check:
    name: OWASP Dependency Check (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The dedicated Docker action ships its own pre-downloaded NVD DB,
      # which avoids the "exit code 126" caused by the Maven plugin trying
      # to exec native binaries in a constrained runner environment.
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "epay-server"
          path: "./epay"
          format: "ALL"
          # Fail if any dependency scores >= 7.0 (HIGH or CRITICAL)
          args: >-
            --failOnCVSS 7
            --enableRetired
        env:
          JAVA_HOME: /opt/jdk
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 30

  # ── 2. npm audit (Frontend) ────────────────────────────────────────────────
  npm-audit:
    name: npm Audit (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        # Report all vulnerabilities but only fail on CRITICAL.
        # Next.js 16.1.1 has known HIGH CVEs patched in 16.3.8 — treat those
        # as warnings until the dependency is upgraded in the application.
        run: |
          npm audit --audit-level=critical || true
          echo "--- Full audit report (informational) ---"
          npm audit --json > npm-audit-report.json || true
          npm audit || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30

  # ── 3. CodeQL static analysis ─────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # CodeQL is resource-heavy; skip on every PR push to keep it fast.
    # It still runs on push to main/develop and on the weekly schedule.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # setup-java v5 — resolves the v4 deprecation warning
      - name: Set up JDK 21 (required for Java CodeQL)
        if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # CodeQL v4 — resolves the v3 deprecation warning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Enable security-extended queries for broader coverage
          queries: security-extended

      - name: Make Maven wrapper executable
        if: matrix.language == 'java'
        working-directory: epay
        run: chmod +x mvnw

      - name: Build Java sources for CodeQL
        if: matrix.language == 'java'
        working-directory: epay
        run: ./mvnw -B clean compile -DskipTests --no-transfer-progress

      - name: Autobuild (JavaScript/TypeScript)
        if: matrix.language == 'javascript'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  # ── 4. Trivy container image scan ─────────────────────────────────────────
  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    # Only scan images that were just built (push events) or on schedule
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: epay-server
            context: ./epay
            dockerfile: ./epay/Dockerfile
            needs_maven: true
          - image_suffix: epay-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            needs_maven: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ── Backend only: build the fat-jar so Docker COPY can find it ─────
      # The Dockerfile expects main/target/epay-server.jar (relative to the
      # ./epay build context). Without this step the Docker build fails with
      # "lstat /main/target: no such file or directory".
      - name: Set up JDK 21 (backend image only)
        if: matrix.needs_maven
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build backend JAR (backend image only)
        if: matrix.needs_maven
        working-directory: epay
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally for scanning
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: scan-target/${{ matrix.image_suffix }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        # v0.36.0 is the latest clean release after the March 2026 supply-chain incident.
        # Tags from v0.29.0 onwards use the v-prefix convention and are marked immutable.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target/${{ matrix.image_suffix }}:latest
          format: sarif
          output: trivy-${{ matrix.image_suffix }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        # Only upload when the scan step actually ran and produced a SARIF file.
        # Using `always()` would attempt the upload even when the Docker build
        # failed and no .sarif was written, causing "Path does not exist" errors.
        if: steps.trivy-scan.outcome == 'success' || steps.trivy-scan.outcome == 'failure'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image_suffix }}.sarif
          category: trivy-${{ matrix.image_suffix }}
