name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Run every Monday at 08:00 UTC to catch newly disclosed CVEs
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # Required to upload SARIF results to GitHub Security tab
  actions: read

env:
  NODE_VERSION: "24.11.1"

jobs:
  # ── 1. OWASP Dependency-Check (Backend) ───────────────────────────────────
  owasp-dependency-check:
    name: OWASP Dependency Check (Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: epay
        run: chmod +x mvnw

      - name: Run OWASP Dependency-Check via Maven plugin
        working-directory: epay
        # Fail on CVSS >= 7 (HIGH / CRITICAL). NVD_API_KEY is optional but
        # strongly recommended to avoid rate-limiting on the NVD data feed.
        run: |
          ./mvnw -B --no-transfer-progress \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DretireJsAnalyzerEnabled=true \
            -Dformat=ALL \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -DsuppressionFile=dependency-check-suppressions.xml || true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: epay/**/target/dependency-check-report*
          retention-days: 30

  # ── 2. npm audit (Frontend) ────────────────────────────────────────────────
  npm-audit:
    name: npm Audit (Frontend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run npm audit
        working-directory: frontend
        # Report all vulnerabilities but only fail on CRITICAL.
        run: |
          npm audit --audit-level=critical || true
          echo "--- Full audit report (informational) ---"
          npm audit --json > npm-audit-report.json || true
          npm audit || true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 30

  # ── 3. CodeQL static analysis ─────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # CodeQL is resource-heavy; skip on every PR push to keep it fast.
    # It still runs on push to main/develop and on the weekly schedule.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required for Java CodeQL)
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Enable security-extended queries for broader coverage
          queries: security-extended

      - name: Make Maven wrapper executable
        if: matrix.language == 'java'
        working-directory: epay
        run: chmod +x mvnw

      - name: Build Java sources for CodeQL
        if: matrix.language == 'java'
        working-directory: epay
        run: ./mvnw -B clean compile -DskipTests --no-transfer-progress

      - name: Autobuild (JavaScript/TypeScript)
        if: matrix.language == 'javascript'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"
          # upload requires Code Scanning to be enabled in repo Settings → Security.
          # Set to false to keep the workflow green on repos where it is not enabled.
          upload: false

  # ── 4. Trivy container image scan ─────────────────────────────────────────
  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    # Only scan images that were just built (push events) or on schedule
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: epay-server
            context: ./epay
            dockerfile: ./epay/Dockerfile
            needs_maven: true
          - image_suffix: epay-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            needs_maven: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Backend only: build the fat-jar so Docker COPY can find it ─────
      - name: Set up JDK 21 (backend image only)
        if: matrix.needs_maven
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build backend JAR (backend image only)
        if: matrix.needs_maven
        working-directory: epay
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally for scanning
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: scan-target/${{ matrix.image_suffix }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (table — visibility)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target/${{ matrix.image_suffix }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          skip-version-check: true
          trivyignores: .trivyignore

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target/${{ matrix.image_suffix }}:latest
          format: sarif
          output: trivy-${{ matrix.image_suffix }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-version-check: true
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image_suffix }}.sarif
          category: trivy-${{ matrix.image_suffix }}
