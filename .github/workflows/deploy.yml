name: Deploy to Production

on:
  workflow_run:
    workflows:
      - Backend CI
      - Frontend CI
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Backend image tag to deploy (e.g. main-abc1234)"
        required: false
        default: "latest"
      frontend_tag:
        description: "Frontend image tag to deploy (e.g. main-abc1234)"
        required: false
        default: "latest"
      skip_health_check:
        description: "Skip post-deploy health check"
        required: false
        default: "false"
        type: boolean

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/epay-server
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/epay-frontend
  DEPLOY_PATH: /opt/epay-app

jobs:
  check-ci-status:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Evaluate deploy gate
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy via Docker Compose
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: needs.check-ci-status.outputs.should_deploy == 'true'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BACKEND_TAG="${{ github.event.inputs.backend_tag }}"
            FRONTEND_TAG="${{ github.event.inputs.frontend_tag }}"
          else
            SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            BACKEND_TAG="main-${SHORT_SHA}"
            FRONTEND_TAG="main-${SHORT_SHA}"
          fi
          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying backend:${BACKEND_TAG}  frontend:${FRONTEND_TAG}"

