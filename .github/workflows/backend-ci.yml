name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "epay/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "epay/**"
      - ".github/workflows/backend-ci.yml"

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}/epay-server
  JAVA_VERSION: "21"

jobs:

  unit-test:
    name: Unit Tests & Coverage (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('epay/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        working-directory: epay
        run: chmod +x mvnw

      - name: Run unit tests with coverage
        working-directory: epay
        run: |
          ./mvnw -B verify -P coverage \
            --no-transfer-progress \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: epay/**/target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: epay/**/target/site/jacoco/
          retention-days: 7

      - name: Build fat-JAR (skip tests — already ran above)
        working-directory: epay
        run: ./mvnw -B package -DskipTests --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: epay-server-jar
          path: epay/main/target/epay-server.jar
          retention-days: 1

  integration-test:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: unit-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('epay/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven wrapper executable
        working-directory: epay
        run: chmod +x mvnw

      - name: Run integration tests
        working-directory: epay
        run: |
          ./mvnw -B verify -P integration-test \
            --no-transfer-progress \
            -Dsurefire.skip=true \
            -Dfailsafe.failIfNoSpecifiedTests=false

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: epay/**/target/failsafe-reports/
          retention-days: 7


  k6-smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    needs: unit-test
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       epay
          POSTGRES_USER:     epay
          POSTGRES_PASSWORD: epay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epay -d epay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: epay-server-jar
          path: epay/main/target/

      - name: Create log directory
        run: sudo mkdir -p /var/log/epay && sudo chmod 777 /var/log/epay

      - name: Start application
        working-directory: epay
        run: |
          java -jar main/target/epay-server.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/epay \
            --spring.datasource.username=epay \
            --spring.datasource.password=epay \
            --spring.data.redis.host=localhost \
            --spring.rabbitmq.host=localhost \
            --server.port=8029 &
          # Wait until actuator/health returns UP
          echo "Waiting for app to start..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://localhost:8029/actuator/health | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('status','DOWN'))" 2>/dev/null || echo DOWN)
            echo "  Attempt ${i}/30: ${STATUS}"
            [ "${STATUS}" = "UP" ] && break
            [ "${i}" = "30" ] && { echo "App failed to start"; exit 1; }
            sleep 5
          done

      - name: Install k6
        run: |
          curl -sfL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin k6-v0.55.0-linux-amd64/k6

      - name: Run k6 smoke test
        run: k6 run -e BASE_URL=http://localhost:8029 k6/smoke.js

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: epay-server-jar
          path: epay/main/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./epay
          file: ./epay/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
